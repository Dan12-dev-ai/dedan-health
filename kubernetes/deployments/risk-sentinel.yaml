apiVersion: apps/v1
kind: Deployment
metadata:
  name: dedan-risk-sentinel
  namespace: dedan-health
  labels:
    app: dedan-risk-sentinel
    version: "2.0.0"
    component: "predictive-triage"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dedan-risk-sentinel
  template:
    metadata:
      labels:
        app: dedan-risk-sentinel
        version: "2.0.0"
        component: "predictive-triage"
    spec:
      containers:
      - name: risk-sentinel
        image: dedan/risk-sentinel:v2.0.0
        ports:
        - containerPort: 8002
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: dedan-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: dedan-secrets
              key: REDIS_URL
        - name: ALERT_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: dedan-secrets
              key: ALERT_WEBHOOK_URL
        - name: LOG_LEVEL
          value: "INFO"
        - name: ANOMALY_THRESHOLD
          value: "0.1"
        - name: RISK_THRESHOLD_HIGH
          value: "0.8"
        - name: RISK_THRESHOLD_MEDIUM
          value: "0.5"
        - name: MONITORING_INTERVAL
          value: "300"  # 5 minutes
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "800m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: dedan-risk-sentinel-service
  namespace: dedan-health
  labels:
    app: dedan-risk-sentinel
spec:
  selector:
    app: dedan-risk-sentinel
  ports:
  - name: http
    port: 80
    targetPort: 8002
  type: ClusterIP
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dedan-risk-analysis
  namespace: dedan-health
  labels:
    app: dedan-risk-sentinel
    component: "risk-analysis"
spec:
  schedule: "0 */15 * * * *"  # Every 15 minutes
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: risk-analysis
            image: dedan/risk-sentinel:v2.0.0
            command: ["python", "-c", "import asyncio; from risk_sentinel import risk_sentinel; asyncio.run(risk_sentinel.analyze_all_patients())"]
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dedan-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: dedan-secrets
                  key: REDIS_URL
            restartPolicy: OnFailure
  successfulJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
